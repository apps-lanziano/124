name: פריסת Cloud Functions + Firestore Rules

# רץ אוטומטית על התשתית של GitHub בכל פעם ש-functions/** או firestore.rules
# משתנים ב-main — בלי תלות בטרמינל של אף אחד ובלי תלות בסשן פתוח. תנאי יחיד:
# הסוד FIREBASE_TOKEN מוגדר במאגר (חד-פעמי, ראו הערה למטה). בלעדיו הריצה
# מדלגת בבטחה על שלב הפריסה ומזהירה בלוג, בלי להיכשל.
#
# ⚠️ לפני שהוספנו את firestore.rules לטריגר (audit אבטחה, 2026-08-22),
# פריסת הכללים הייתה שלב **ידני בלבד** ("firebase deploy --only firestore:rules")
# — כלומר לא היה שום דבר שמבטיח ש-firestore.rules במאגר תואם למה שבאמת רץ
# בפרודקשן. אל תניחו ש-GitHub==Production בלי הטריגר הזה.
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # secrets.* אסור לשימוש ישיר בתוך if: (שגיאת "Unrecognized named-value:
    # 'secrets'" — זו הסיבה שכל ריצה נכשלה עד עכשיו, עוד לפני שהתחיל אף
    # job). הפתרון: מעתיקים את הסוד ל-env ברמת ה-job, ובודקים env. ב-if:.
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: התקנת תלויות הפונקציות
        run: npm --prefix functions ci

      # שער בטיחות לפני פריסה לפרודקשן — אותן בדיקות טהורות (בלי דרישה
      # ל-emulator) שכל שינוי ב-functions/lib עובר לפני מיזוג ל-main.
      # אם משהו נשבר כאן, הפריסה נעצרת ולא מגיעה לייצור.
      - name: הרצת בדיקות הלוגיקה הטהורה של הפונקציות
        run: |
          for f in qa/suite/analyze_board_image_wiring_test.mjs \
                   qa/suite/authorize_lib_test.mjs \
                   qa/suite/backup_lib_test.mjs \
                   qa/suite/board_ai_analyze_lib_test.mjs \
                   qa/suite/cert_expiry_reminders_lib_test.mjs \
                   qa/suite/daily_digest_lib_test.mjs \
                   qa/suite/duty_roster_digest_lib_test.mjs \
                   qa/suite/fault_notify_test.mjs \
                   qa/suite/morning_rollcall_notify_test.mjs \
                   qa/suite/notify_lib_test.mjs \
                   qa/suite/quiet_days_lib_test.mjs \
                   qa/suite/reminders_lib_test.mjs \
                   qa/suite/reserve_refresh_reminders_lib_test.mjs \
                   qa/suite/scheduled_functions_wiring_test.mjs \
                   qa/suite/vo_reminders_lib_test.mjs; do
            echo "::group::$f"
            node "$f" || exit 1
            echo "::endgroup::"
          done

      # שער בטיחות שני, ייעודי לכללי Firestore: מריץ את הכללים האמיתיים
      # (firestore.rules) על Firestore Emulator אמיתי ובודק את כל מטריצת
      # ההרשאות (אנונימי/לא-מורשה/חייל/מפקד × get/list/create/update/delete).
      # אם מישהו הרחיב כלל בטעות (רגרסיית אבטחה) — הפריסה נעצרת כאן,
      # *לפני* שהכלל השגוי מגיע לפרודקשן.
      - name: התקנת תלויות השורש (ל-emulator ולבדיקת הכללים)
        run: npm ci --no-audit --no-fund

      - name: שער בטיחות — בדיקת Firestore Rules על Emulator אמיתי
        run: node qa/suite/firestore_rules_test.mjs

      # --force נדרש כדי שהפריסה תוכל למחוק פונקציות שהוסרו מהקוד (למשל
      # remindLicenseExpiryDaily שהוסרה בעבר) גם במצב לא-אינטראקטיבי.
      # בלי זה, firebase deploy עוצר את כל הפריסה (הכל-או-כלום) ברגע
      # שהוא מוצא פונקציה שקיימת בייצור אך לא בקוד המקומי — מה שגרם
      # לשתי פריסות רצופות להיכשל בשקט ולהשאיר את הייצור תקוע בגרסה ישנה.
      #
      # --only functions,firestore:rules: מפרסם את שניהם יחד תמיד, גם אם
      # רק אחד מהם השתנה בפועל — כדי ש-firestore.rules שבמאגר יהיה תמיד
      # מה שבאמת רץ בפרודקשן (ר' ההערה בראש הקובץ).
      - name: פריסה ל-Firebase (Cloud Functions + Firestore Rules)
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: npx firebase-tools@13 deploy --only functions,firestore:rules --project squadron124-96357 --token "$FIREBASE_TOKEN" --non-interactive --force

      - name: אזהרה אם אין טוקן פריסה מוגדר
        if: ${{ env.FIREBASE_TOKEN == '' }}
        run: |
          echo "::warning::FIREBASE_TOKEN אינו מוגדר ב-Secrets של המאגר — שלב הפריסה דולג. ראו הוראות ההגדרה החד-פעמית (README/הודעת ה-PR)."
