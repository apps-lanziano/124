name: דוח בדיקה יומי

# רץ על התשתית של GitHub — לא תלוי בשום מחשב או סשן פתוח.
on:
  schedule:
    - cron: '50 2 * * *'      # 02:50 UTC = 05:50 בישראל (שעון קיץ)
  workflow_dispatch:           # אפשר גם להריץ ידנית מלשונית Actions

permissions:
  contents: write              # לשמירת הדוח במאגר
  issues: write                # לפתיחת issue כשיש ממצא חמור

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: התקנת Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: הרצת הסוכנים
        id: scan
        run: |
          set +e
          node qa/run_daily.mjs > /tmp/report_stdout.txt 2>/tmp/report_stderr.txt
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/report_stderr.txt || true
          # קוד 0 = הכל תקין, קוד 1 = נמצאו ממצאים (שניהם ריצה תקינה).
          # כל דבר אחר = הסורק עצמו קרס — חייב להכשיל את ה-workflow ולא
          # להציג "success" מטעה. אותה בעיה בדיוק שתיקנו באפליקציה עצמה.
          if [ "$code" -gt 1 ]; then
            echo "::error::הסורק קרס (קוד $code) — הדוח לא הופק"
            tail -40 /tmp/report_stdout.txt || true
            exit 1
          fi
          # ודא שהדוח באמת נכתב מחדש בריצה הזו (ולא נשאר ישן מהמאגר)
          if [ ! -f qa/reports/latest.md ]; then
            echo "::error::קובץ הדוח לא נוצר"
            exit 1
          fi
          if [ -z "$(find qa/reports/latest.md -mmin -10)" ]; then
            echo "::error::הדוח לא עודכן בריצה הזו — כנראה הסורק לא רץ בפועל"
            exit 1
          fi

      - name: שמירת הדוח במאגר
        run: |
          git config user.name  "QA Bot"
          git config user.email "actions@github.com"
          git add qa/reports/ || true
          if git diff --cached --quiet; then
            echo "אין שינוי בדוח — לא נוצר commit"
          else
            git commit -m "דוח בדיקה יומי $(date -u +%Y-%m-%d)"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: פתיחת issue אם נמצא ממצא חמור
        if: steps.scan.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('qa/reports/latest.md', 'utf8').slice(0, 60000);
            const title = `🔴 דוח בדיקה יומי — נמצאו ממצאים (${new Date().toISOString().slice(0,10)})`;
            // אם כבר פתוח issue מהסוכן — מוסיפים תגובה במקום לפתוח חדש
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'qa-daily',
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['qa-daily'],
              });
            }

      - name: העלאת הדוח כקובץ להורדה
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-qa-report
          path: qa/reports/latest.md
          retention-days: 30
