name: בדיקות (CI)

# רץ את כל חבילת הבדיקות (qa/suite/*.mjs) בכל דחיפה ובכל Pull Request —
# כדי שאף שינוי לא יגיע ל-main בלי שכל הבדיקות ירוקות. הבדיקות רצות עם
# אחסון מדומה בזיכרון וחסימת רשת מלאה (ר' qa/lib/harness.mjs), ולכן אינן
# דורשות Firebase או שום Secret — הן בטוחות לריצה על התשתית של GitHub.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

# מבטל ריצה קודמת על אותו ענף אם נדחף commit חדש — חוסך זמן runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # שתי בדיקות בחבילה מריצות את כללי האבטחה האמיתיים על Firebase
      # Emulator, וזה רץ על Java. ה-runner של GitHub מגיע עם Java 17
      # כברירת מחדל, ו-firebase-tools 15 דורש 21+ — בלי השלב הזה שתי
      # בדיקות האבטחה נכשלו על הסביבה ולא על הקוד.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: בדיקת סנכרון גרסת Service Worker
        run: node scripts/sw-cache-name.mjs --check

      - name: התקנת Playwright ודפדפן
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: הרצת חבילת הבדיקות
        # דילוג של בדיקה בגלל סביבה חסרה = כשל כאן, כדי שבדיקות
        # האבטחה לא "יעברו" בשקט בלי לרוץ בפועל.
        env:
          QA_REQUIRE_EMULATOR: '1'
        run: |
          fail=0
          pass=0
          for f in qa/suite/*.mjs; do
            if node "$f" > /tmp/qa_test.log 2>&1; then
              echo "✅ $f"
              pass=$((pass+1))
            else
              echo "::error::בדיקה נכשלה: $f"
              # שלוש שורות ה-❌ הראשונות, או זנב הפלט אם אין
              grep '❌' /tmp/qa_test.log | head -3 || tail -20 /tmp/qa_test.log
              fail=$((fail+1))
            fi
          done
          echo "---------------------------------------------"
          echo "עברו: $pass · נכשלו: $fail"
          exit $fail

  site-smoke:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: suite
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: המתנה לפריסת Pages
        run: sleep 90

      - name: בדיקת זמינות האתר
        run: |
          URL="https://eladlanzianog-sys.github.io/124/"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$URL" || echo "000")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::🔴 האתר לא זמין אחרי פריסה (HTTP $STATUS) — בדקו Settings → Pages"
          fi
          BODY=$(curl -s --max-time 15 "$URL")
          if echo "$BODY" | grep -q "sq124"; then
            echo "✅ האתר זמין ומגיש את האפליקציה"
          else
            echo "::warning::🔴 האתר מגיש תוכן לא צפוי — ייתכן ש-Pages כבוי"
          fi
